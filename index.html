<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>TindahanTrack</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" data-act="menu" aria-label="Open menu"><i data-lucide="menu"></i></button>
    <strong id="storeName">TindahanTrack</strong>
    <span class="grow"></span>
    <span id="who" class="muted"></span>
    <button class="btn ghost sm" data-act="logout"><i data-lucide="log-out"></i>Logout</button>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="brand"><b>TindahanTrack</b><small>Benta, Bantay, Bilang — Lahat Nasa Isang Lugar.</small></div>
    <nav class="nav">
      <a href="#dashboard" data-page="dashboard"><i data-lucide="layout-dashboard"></i>Dashboard</a>
      <a href="#pos" data-page="pos"><i data-lucide="shopping-cart"></i>Point of Sale</a>
      <a href="#products" data-page="products"><i data-lucide="package"></i>Products &amp; Stock</a>
      <a href="#utang" data-page="utang"><i data-lucide="users"></i>Utang &amp; Customers</a>
    </nav>
  </aside>
  <div class="overlay" id="overlay" data-act="menu"></div>

  <main class="view" id="view"></main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button class="icon-btn" data-act="close" aria-label="Close"><i data-lucide="x"></i></button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="receipt"></div>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
